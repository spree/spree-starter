name: Release Docker Image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: spree/spree
  # OCI metadata that docker/metadata-action does not derive from the repository.
  IMAGE_METADATA: |
    org.opencontainers.image.title=Spree Commerce
    org.opencontainers.image.description=Spree Commerce: open-source headless commerce platform. REST Store and Admin APIs (OpenAPI), Admin Dashboard, MCP server, webhooks and a built-in marketplace in one image. Integrate with the TypeScript SDKs.
    org.opencontainers.image.url=https://spreecommerce.org
    org.opencontainers.image.documentation=https://spreecommerce.org/docs
    org.opencontainers.image.vendor=Spree Commerce

jobs:
  release-docker:
    name: "Build (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: ${{ env.IMAGE_METADATA }}
          annotations: ${{ env.IMAGE_METADATA }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release-docker-manifest:
    name: "Publish manifest"
    needs: release-docker
    runs-on: ubuntu-latest

    env:
      # Multi-platform images carry their description on the image index.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          annotations: ${{ env.IMAGE_METADATA }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest

      - name: Create and push manifest
        working-directory: /tmp/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$META_JSON")
          mapfile -t annotations < <(jq -r '.annotations[] | "--annotation=" + .' <<< "$META_JSON")
          docker buildx imagetools create "${tags[@]}" "${annotations[@]}" \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
