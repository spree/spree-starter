test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

amazon:
  service: S3
  access_key_id: <%= ENV.fetch("AWS_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("AWS_SECRET_ACCESS_KEY", "") %>
  region: <%= ENV.fetch("AWS_REGION", "") %>
  bucket: <%= ENV.fetch("AWS_BUCKET", "spree-#{Rails.env}") %>

cloudflare:
  service: S3
  endpoint: <%= ENV.fetch("CLOUDFLARE_ENDPOINT", "") %>
  access_key_id: <%= ENV.fetch("CLOUDFLARE_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("CLOUDFLARE_SECRET_ACCESS_KEY", "") %>
  region: auto
  bucket: <%= ENV.fetch("CLOUDFLARE_BUCKET", "spree-#{Rails.env}") %>
  force_path_style: true
  request_checksum_calculation: "when_required"
  response_checksum_validation: "when_required"

ovh:
  service: S3
  endpoint: <%= ENV["OVH_ENDPOINT"].presence || "https://s3.#{ENV["OVH_REGION"].presence || "gra"}.io.cloud.ovh.net" %>
  access_key_id: <%= ENV.fetch("OVH_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("OVH_SECRET_ACCESS_KEY", "") %>
  region: <%= ENV["OVH_REGION"].presence || "gra" %>
  bucket: <%= ENV.fetch("OVH_BUCKET", "spree-#{Rails.env}") %>
  force_path_style: true
  request_checksum_calculation: "when_required"
  response_checksum_validation: "when_required"

digitalocean:
  service: S3
  endpoint: <%= ENV["DO_SPACES_ENDPOINT"].presence || "https://#{ENV["DO_SPACES_REGION"].presence || "nyc3"}.digitaloceanspaces.com" %>
  access_key_id: <%= ENV.fetch("DO_SPACES_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("DO_SPACES_SECRET_ACCESS_KEY", "") %>
  region: <%= ENV["DO_SPACES_REGION"].presence || "nyc3" %>
  bucket: <%= ENV.fetch("DO_SPACES_BUCKET", "spree-#{Rails.env}") %>
  request_checksum_calculation: "when_required"
  response_checksum_validation: "when_required"

# Any other S3-compatible provider (Backblaze B2, Wasabi, Hetzner, Scaleway, MinIO, ...)
s3_compatible:
  service: S3
  endpoint: <%= ENV.fetch("S3_ENDPOINT", "") %>
  access_key_id: <%= ENV.fetch("S3_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("S3_SECRET_ACCESS_KEY", "") %>
  region: <%= ENV.fetch("S3_REGION", "us-east-1") %>
  bucket: <%= ENV.fetch("S3_BUCKET", "spree-#{Rails.env}") %>
  force_path_style: <%= ENV.fetch("S3_FORCE_PATH_STYLE", "true") == "true" %>
  request_checksum_calculation: "when_required"
  response_checksum_validation: "when_required"
