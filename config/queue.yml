# Solid Queue process topology. In the default deployment this runs inside
# Puma (config/puma.rb, SOLID_QUEUE_IN_PUMA) — worker threads share the web
# process and its DB pool (see config/database.yml). The same file configures
# the dedicated supervisor when jobs split out into a `bin/jobs` service.
#
# JOB_THREADS sizes the worker pool (default 3, matching Solid Queue —
# job threads share the process and its GVL with web requests, so more
# threads trade web latency for job throughput). Raise it on a dedicated
# `bin/jobs` worker, or scale with JOB_CONCURRENCY (worker process count,
# the standard Rails knob) there.
#
# Queues are polled in order: checkout-critical and operator-facing work
# first, bulk catalog churn second, Active Storage housekeeping last. There is
# no "*" catch-all, because it would also take the image queues below — a
# queue added later must be listed here, or its jobs never run.
#
# Resizing and analysing images runs on a worker of its own, sized by
# JOB_IMAGE_THREADS (default 1). libvips decodes the whole source image, so
# every concurrent resize holds hundreds of MB; the work is CPU-bound, so more
# threads than CPUs only add memory, not speed. The default of 1 also keeps
# resizes from crowding web requests when jobs run inside Puma. On a dedicated
# `bin/jobs` worker, set it to that machine's CPU count. Downloading images
# (spree_images) is network-bound and stays on the main pool.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues:
        - default
        - spree_imports
        - spree_payment_webhooks
        - spree_stock_reservations
        - mailers
        - spree_events
        - spree_exports
        - spree_images
        - spree_products
        - spree_variants
        - spree_categories
        - spree_collections
        - spree_stock_location_stock_levels
        - spree_coupon_codes
        - spree_addresses
        - spree_gift_cards
        - spree_webhooks
        - spree_api_keys
        - spree_search
        - spree_tax_identifiers
        - spree_payouts
        - spree_data_requests
        - active_storage_purge
        - solid_queue_recurring
      threads: <%= ENV.fetch("JOB_THREADS", 3) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues:
        - active_storage_transform
        - active_storage_analysis
      threads: <%= ENV.fetch("JOB_IMAGE_THREADS", 1) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
